services:
  postgres:
    image: postgres:16-alpine
    container_name: anvyra-postgres
    environment:
      POSTGRES_DB: anvyra_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anvyra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: anvyra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - anvyra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anvyra-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/anvyra_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRES_MS: ${APP_JWT_EXPIRES_MS:-900000}
      APP_JWT_REFRESH_EXPIRES_SECONDS: ${APP_JWT_REFRESH_EXPIRES_SECONDS:-2592000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - anvyra-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time — browser talks to localhost:8080
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    container_name: anvyra-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - anvyra-network
    restart: unless-stopped

networks:
  anvyra-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
