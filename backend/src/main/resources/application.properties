spring.application.name=anvyra-backend

# ─── PostgreSQL ──────────────────────────────────────────────────────────────
# DB_URL accepts either jdbc:postgresql://... or postgresql://... (Render format)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/anvyra_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ─── JWT ─────────────────────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:AnvyraSecretKeyForDevOnlyReplaceInProduction1234567890ABCDEF}
app.jwt.expiration-ms=${APP_JWT_EXPIRES_MS:900000}
app.jwt.refresh-expiration-seconds=${APP_JWT_REFRESH_EXPIRES_SECONDS:2592000}

# ─── Redis ───────────────────────────────────────────────────────────────────
# Supports full URL (Upstash TLS) or individual host/port for local dev
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# ─── CORS ────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
