name: CI - Backend Sample

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ENV: prod
      APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
      APP_JWT_EXPIRES_MS: ${{ secrets.APP_JWT_EXPIRES_MS }}
      APP_JWT_REFRESH_EXPIRES_MS: ${{ secrets.APP_JWT_REFRESH_EXPIRES_MS }}
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Build with Maven
        run: ./mvnw -B -DskipTests=true clean package

# This workflow is a sample to show how to wire secrets into CI.
# Do NOT commit production secrets. Configure them in GitHub repository Settings -> Secrets -> Actions.
